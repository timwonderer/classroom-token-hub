name: Documentation Link Checks

on:
  pull_request:
    paths: ["README.md", "DEVELOPMENT.md", "CONTRIBUTING.md", "docs/**", "lychee.toml", "scripts/check_production_docs.py", ".github/workflows/docs-links.yml"]
  push:
    branches: [main]
    paths: ["README.md", "DEVELOPMENT.md", "CONTRIBUTING.md", "docs/**", "lychee.toml", "scripts/check_production_docs.py", ".github/workflows/docs-links.yml"]
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline .

  markdown-web-links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install md-dead-link-check==1.3.0
      - run: md-dead-link-check --config pyproject.toml

  production-docs-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --min-urls guards against the crawl reaching the index, finding no
      # onward links, and reporting success while having proven nothing.
      # --max-urls stays under the app's default 200 requests/hour per client:
      # the help centre is ~110 pages, which cost ~130 requests with the
      # trailing-slash redirects (measured 2026-09-28 against a local app).
      # The CF_ACCESS_* secrets are an optional Cloudflare Access service token.
      # Without them a maintenance window fails this job, naming the Access
      # redirect; with them the crawl reaches the app through the gate.
      - run: python scripts/check_production_docs.py --base-url https://app.classroomtokenhub.com --crawl --start-path /docs/ --max-urls 180 --min-urls 10 --timeout 20 --delay 2
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
