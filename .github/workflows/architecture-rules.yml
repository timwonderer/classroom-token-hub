name: Architecture rules

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  architecture-rules:
    # The repository's own Semgrep rules (semgrep/), versioned with the code.
    # Separate from the Semgrep GitHub App's managed scan, which runs the
    # dashboard's generic rules. Needs no secrets, so it also runs on Dependabot
    # pull requests. Not a hidden directory: `semgrep --test` skips
    # dot-directories and then reports "No unit tests found" with exit 0.
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep
        run: python3 -m pip install --quiet "semgrep==1.180.0"
      - name: Rule tests (each rule still catches its annotated cases)
        # Fail unless tests were actually found and passed; finding none exits 0.
        run: |
          out="$(semgrep --test --metrics=off semgrep/ 2>&1)"; echo "$out"
          echo "$out" | grep -q "All tests passed"
      - name: Scan the application
        run: semgrep scan --metrics=off --error --config semgrep/ app wsgi.py
