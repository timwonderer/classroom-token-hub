name: Release v2 to Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact commit SHA to release"
        required: true
        type: string
      lineage_ref:
        description: "Approved v2 release-lineage ref configured for production"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release exact v2 revision
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate approved v2 revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_LINEAGE: ${{ inputs.lineage_ref }}
          APPROVED_LINEAGE: ${{ vars.V2_RELEASE_LINEAGE_REF }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED_REVISION" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Revision must be a full 40-character commit SHA."; exit 1
          fi
          if [ -n "$REQUESTED_LINEAGE" ] && [ "$REQUESTED_LINEAGE" != "$APPROVED_LINEAGE" ]; then
            echo "Requested lineage does not match the production-approved lineage."; exit 1
          fi
          if [ -z "$APPROVED_LINEAGE" ]; then
            echo "Production variable V2_RELEASE_LINEAGE_REF is not configured."; exit 1
          fi
          git fetch --no-tags origin "$APPROVED_LINEAGE"
          revision="$(git rev-parse "$REQUESTED_REVISION^{commit}")"
          lineage="$(git rev-parse "origin/$APPROVED_LINEAGE^{commit}")"
          [ "$revision" = "$REQUESTED_REVISION" ] || { echo "Revision did not resolve exactly."; exit 1; }
          git merge-base --is-ancestor "$revision" "$lineage" || { echo "Revision is outside approved lineage."; exit 1; }
          echo "Approved revision: $revision"
          echo "Approved lineage tip: $lineage"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.PRODUCTION_TAILSCALE_HOST }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DO_DEPLOY_KEY }}

      - name: Set up SSH host key verification
        env:
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH transport
        env:
          PRODUCTION_SERVER_HOST: ${{ secrets.PRODUCTION_TAILSCALE_HOST }}
        run: |
          ssh -o BatchMode=yes root@"$PRODUCTION_SERVER_HOST" 'set -e; test -d ~/classroom-economy; echo "SSH transport ready on $(hostname)"'

      - name: Deploy exact revision
        env:
          PRODUCTION_SERVER_HOST: ${{ secrets.PRODUCTION_TAILSCALE_HOST }}
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          ssh root@"$PRODUCTION_SERVER_HOST" "RELEASE_REVISION='$RELEASE_REVISION' bash -s" <<'EOF'
            set -euo pipefail
            cd ~/classroom-economy
            git fetch --no-tags origin "$RELEASE_REVISION"
            git reset --hard "$RELEASE_REVISION"
            # `reset --hard` leaves untracked files in place, and /docs serves any
            # .md it finds under docs/. Without this, a document deleted in git
            # stays on disk and stays publicly readable for the life of the box.
            # Scoped to docs/ on purpose: a bare clean would delete venv/ and .env.
            git clean -fd docs/
            source venv/bin/activate
            # Before migrations: a revision that bumps a pin may also ship a
            # migration that imports the new version.
            pip install --requirement requirements.txt
            flask db upgrade
            sudo systemctl restart classroom-economy
            sudo systemctl is-active --quiet classroom-economy
            echo "Released exact revision $RELEASE_REVISION"
          EOF

      - name: Verify production health
        env:
          PRODUCTION_SERVER_HOST: ${{ secrets.PRODUCTION_TAILSCALE_HOST }}
        run: |
          ssh root@"$PRODUCTION_SERVER_HOST" 'set -e; curl --fail --silent --show-error http://127.0.0.1/health >/tmp/cth-health; test "$(cat /tmp/cth-health)" = "ok"; echo "Production health passed"'
