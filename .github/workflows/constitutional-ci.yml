name: Constitutional CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Revision to compare for manual validation"
        required: true
        type: string

permissions:
  contents: read
  # Pull the CI Postgres image from GHCR (mirror-ci-postgres.yml).
  packages: read

concurrency:
  group: constitutional-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  constitutional-evidence:
    name: Constitutional evidence classifier and runner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/timwonderer/ci-postgres:15
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: classroom_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install memory-only setup test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-check evidence manifest
        run: |
          set -o pipefail
          python scripts/ci_evidence_runner.py --self-check \
            | tee constitutional-ci-selfcheck.json

      - name: Collect changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Unable to establish a valid base revision."
            exit 2
          fi
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed_paths.txt
          if [ ! -s changed_paths.txt ]; then
            echo "No changed paths were discovered; classifier must fail closed."
            exit 2
          fi

          # CI-RENDER's evidence is parametrized over ACCESSIBILITY_TEMPLATE_PATHS.
          # Unset, the parameter set is empty, pytest exits 0, and the family
          # reports PASS having audited nothing. Deleted templates are excluded
          # because the audit renders each file it is given.
          git diff --name-only --diff-filter=AM "${BASE_SHA}...${HEAD_SHA}" -- 'templates/**' \
            > changed_templates.txt
          {
            echo "ACCESSIBILITY_TEMPLATE_PATHS<<TEMPLATE_LIST_EOF"
            cat changed_templates.txt
            echo "TEMPLATE_LIST_EOF"
          } >> "${GITHUB_ENV}"

      - name: Guard Jinja output escaping
        env:
          JINJA_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Manual comparison input cannot approve branch-created exemptions.
          if [ -z "${JINJA_GUARD_BASE_SHA}" ]; then
            JINJA_GUARD_BASE_SHA=$(git merge-base HEAD "refs/remotes/origin/${DEFAULT_BRANCH}")
            export JINJA_GUARD_BASE_SHA
          fi
          python -m pytest --noconftest -q tests/test_no_unsafe_jinja_markup.py

      - name: Run constitutional evidence runner
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          FLASK_APP: app
          FLASK_ENV: testing
          # No SECRET_KEY, ENCRYPTION_KEY, PEPPER_KEY or AUDIT_HMAC_KEY, on
          # purpose. Every evidence command is a pytest module under tests/, so
          # conftest.py supplies deterministic test values for all four, and
          # the auxiliary validators never import the app. Reading them from
          # secrets made the result depend on who opened the PR: Dependabot
          # and fork PRs receive no Actions or environment secrets, an unset
          # secret expands to an empty string, and an empty string defeats the
          # setdefault() conftest.py relies on — so app/__init__.py refused to
          # start and every evidence family failed.
        run: |
          set -o pipefail
          python scripts/ci_evidence_runner.py \
            --paths-file changed_paths.txt \
            --pytest python \
            | tee constitutional-ci-result.json

      - name: Publish constitutional result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: constitutional-ci-result
          path: |
            constitutional-ci-result.json
            constitutional-ci-selfcheck.json
            changed_paths.txt
            changed_templates.txt
          if-no-files-found: error
