name: Accessibility Gate

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'static/css/**'
      - 'static/js/**'
      - 'tests/test_username_retention_check_browser.py'
      - 'tests/test_axe_*.py'
      - 'tests/axe_coverage_exemptions.json'
      - 'tests/a11y_fixtures/**'
      - 'tests/helpers/axe_wcag.py'
      - 'tests/assets/axe-core.min.js'
      - 'scripts/check_axe_template_coverage.py'
      - '.github/workflows/accessibility-gate.yml'
      - 'app/routes/**'
      - 'app/forms.py'

permissions:
  contents: read
  # Pull the CI Postgres image from GHCR (mirror-ci-postgres.yml).
  packages: read
  pull-requests: write

jobs:
  accessibility-audit:
    name: WCAG 2.1 AA Compliance Audit
    runs-on: ubuntu-latest

    # Use a service container for the test database
    services:
      postgres:
        image: ghcr.io/timwonderer/ci-postgres:15
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: classroom_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install memory-only setup test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright
          playwright install chromium --with-deps

      - name: Initialize Database
        env:
          FLASK_APP: app
          FLASK_ENV: testing
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          # `flask db upgrade` imports the app outside pytest, so conftest.py
          # cannot supply these and app/__init__.py refuses to start without
          # them. They are the same throwaway values conftest.py uses, not
          # secrets. Do not read them from secrets: Dependabot and fork PRs
          # receive none, and an unset secret expands to an empty string,
          # which the startup check rejects.
          SECRET_KEY: test-secret
          PEPPER_KEY: test-primary-pepper
          ENCRYPTION_KEY: jhe53bcYZI4_MZS4Kb8hu8-xnQHHvwqSX8LN4sDtzbw=
          AUDIT_HMAC_KEY: test-audit-hmac-key-for-tests-only-not-for-production
        run: |
          flask db upgrade

      - name: Collect Changed Templates
        id: changed_templates
        run: |
          git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'templates/**' > /tmp/changed_templates.txt
          if [ ! -s /tmp/changed_templates.txt ]; then
            echo "templates=" >> "$GITHUB_OUTPUT"
            echo "No template files changed; skipping accessibility audit."
            exit 0
          fi

          {
            echo "templates<<EOF"
            cat /tmp/changed_templates.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Templates are not the only thing that changes rendered accessibility:
      # styles, template-driven scripts and the harness itself do too.
      - name: Detect changes that affect rendered accessibility
        id: axe_scope
        run: |
          if git diff --name-only --diff-filter=AMDR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
              'templates/**' 'static/css/**' 'static/js/**' 'tests/a11y_fixtures/**' 'tests/test_axe_*.py' \
              'tests/helpers/axe_wcag.py' 'tests/axe_coverage_exemptions.json' 'scripts/check_axe_template_coverage.py' \
              '.github/workflows/accessibility-gate.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Accessibility Test Suite
        if: steps.changed_templates.outputs.templates != ''
        env:
          FLASK_APP: app
          FLASK_ENV: testing
          # conftest.py supplies the app keys under pytest; see Initialize Database.
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          ACCESSIBILITY_TEMPLATE_PATHS: ${{ steps.changed_templates.outputs.templates }}
        run: |
          echo "♿ Running template-scoped accessibility audit..."
          pytest tests/test_accessibility.py -v

      - name: Check username retention interaction in Chromium
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
        run: pytest -q tests/test_username_retention_check_browser.py

      # Hard stop: axe-core runs in Chromium on every PR that touches templates or
      # styles, over two canonical render paths: the real-route sweep and the
      # registered fixture states (tests/a11y_fixtures). The PR fails on any axe
      # violation, on a fixture that cannot render, and on a changed template that
      # neither path renders (SOP-TEST-002 §X). The static check above cannot judge
      # colour contrast, focus, or ARIA semantics. Make this check *required* in the
      # branch protection settings for main so it cannot be merged around.
      - name: Run axe-core over the real-route sweep and the fixture states
        if: steps.axe_scope.outputs.run == 'true'
        env:
          FLASK_APP: app
          FLASK_ENV: testing
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          # A missing browser is a failure here, never a skip.
          AXE_REQUIRE_BROWSER: '1'
          AXE_RENDERED_TEMPLATES_FILE: /tmp/axe_rendered_templates.json
          AXE_FIXTURE_TEMPLATES_FILE: /tmp/axe_fixture_templates.json
        run: |
          pytest -q tests/test_axe_app_pages.py tests/test_axe_fixture_pages.py tests/test_axe_compliance.py

      - name: Require every changed template to have an accessibility render path
        if: steps.axe_scope.outputs.run == 'true'
        run: |
          python scripts/check_axe_template_coverage.py \
            --changed /tmp/changed_templates.txt \
            --rendered /tmp/axe_rendered_templates.json \
            --fixture-rendered /tmp/axe_fixture_templates.json \
            --exemptions tests/axe_coverage_exemptions.json

      - name: Gate unit tests (the guard and the fixture harness must themselves fail when they should)
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          AXE_REQUIRE_BROWSER: '1'
        run: pytest -q tests/test_axe_template_coverage_guard.py tests/test_axe_fixture_gate.py
