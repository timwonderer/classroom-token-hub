name: Accessibility Gate

on:
  pull_request:
    paths:
      - 'templates/**'
      - 'static/css/**'
      - 'app/routes/**'
      - 'app/forms.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  accessibility-audit:
    name: WCAG 2.1 AA Compliance Audit
    runs-on: ubuntu-latest

    # Use a service container for the test database
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: classroom_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright
          playwright install chromium --with-deps

      - name: Initialize Database
        env:
          FLASK_APP: app
          FLASK_ENV: testing
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          # `flask db upgrade` imports the app outside pytest, so conftest.py
          # cannot supply these and app/__init__.py refuses to start without
          # them. They are the same throwaway values conftest.py uses, not
          # secrets. Do not read them from secrets: Dependabot and fork PRs
          # receive none, and an unset secret expands to an empty string,
          # which the startup check rejects.
          SECRET_KEY: test-secret
          PEPPER_KEY: test-primary-pepper
          ENCRYPTION_KEY: jhe53bcYZI4_MZS4Kb8hu8-xnQHHvwqSX8LN4sDtzbw=
          AUDIT_HMAC_KEY: test-audit-hmac-key-for-tests-only-not-for-production
        run: |
          flask db upgrade

      - name: Collect Changed Templates
        id: changed_templates
        run: |
          git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'templates/**' > /tmp/changed_templates.txt
          if [ ! -s /tmp/changed_templates.txt ]; then
            echo "templates=" >> "$GITHUB_OUTPUT"
            echo "No template files changed; skipping accessibility audit."
            exit 0
          fi

          {
            echo "templates<<EOF"
            cat /tmp/changed_templates.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Accessibility Test Suite
        if: steps.changed_templates.outputs.templates != ''
        env:
          FLASK_APP: app
          FLASK_ENV: testing
          # conftest.py supplies the app keys under pytest; see Initialize Database.
          DATABASE_URL: postgresql://user:password@localhost:5432/classroom_test_db
          ACCESSIBILITY_TEMPLATE_PATHS: ${{ steps.changed_templates.outputs.templates }}
        run: |
          echo "♿ Running template-scoped accessibility audit..."
          pytest tests/test_accessibility.py -v
