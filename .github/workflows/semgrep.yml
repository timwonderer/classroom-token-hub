# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '27 22 * * 3'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4

      # Scan code using project's configuration on https://semgrep.dev/manage
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  architecture-rules:
    # The repository's own rules (semgrep/), versioned with the code. Needs no
    # secrets, so it also runs on Dependabot pull requests. Not a hidden
    # directory: `semgrep --test` skips dot-directories and then reports
    # "No unit tests found" with exit 0.
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: python3 -m pip install --quiet "semgrep==1.180.0"
      - name: Rule tests (each rule still catches its annotated cases)
        # Fail unless tests were actually found and passed; finding none exits 0.
        run: |
          out="$(semgrep --test --metrics=off semgrep/ 2>&1)"; echo "$out"
          echo "$out" | grep -q "All tests passed"
      - name: Scan the application
        run: semgrep scan --metrics=off --error --config semgrep/ app wsgi.py
