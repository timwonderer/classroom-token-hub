name: Deploy GitHub Pages Site

# The Pages deployment is one artifact assembled from two sources:
#
#   /            github-pages/   — the static marketing + policy pages
#   /docs/       docs-generator-proof/ — the Hugo + Hextra developer documentation
#                                  site, built from the docs/ tree
#
# User guides are NOT published here. They are served by the Flask app at
# app.classroomtokenhub.com/docs/ — see app/routes/docs.py.

on:
  push:
    branches:
      - main
    paths:
      - 'github-pages/**'
      - 'docs-generator-proof/**'
      - 'docs/**'
      - 'templates/macros/docs_hero.html'
      - 'static/images/icon-192.png'
      - '.github/workflows/github-pages.yml'
  pull_request:
    paths:
      - 'github-pages/**'
      - 'docs-generator-proof/**'
      - 'docs/**'
      - 'templates/macros/docs_hero.html'
      - 'static/images/icon-192.png'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

# Least privilege: `build` downloads checksum-pinned tools and runs the docs
# build, whose child processes inherit the job environment. OIDC belongs only to the job that
# deploys, so id-token lives on `deploy`.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.py reads `git log` for each document's last-updated date. A
          # shallow clone has no history to read, so the deployed pages would
          # show missing or wrong dates.
          fetch-depth: 0

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install docs build dependencies
        run: python -m pip install PyYAML==6.0.3 Jinja2==3.1.6 pytest==9.1.1

      # Hugo, Hextra and FlexSearch are downloaded and verified against
      # docs-generator-proof/tools.lock.json; a checksum mismatch stops the build.
      - name: Fetch pinned Hugo toolchain
        run: python docs-generator-proof/bootstrap.py

      - name: Build developer docs site
        run: python docs-generator-proof/build.py

      # Publication scope, links, anchors, assets, search coverage and edit
      # links; a failure here blocks the deploy.
      - name: Check developer docs site
        run: |
          python docs-generator-proof/check.py
          python -m pytest --noconftest -q docs-generator-proof/test_proof.py

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R github-pages/. _site/
          mkdir -p _site/docs
          cp -R docs-generator-proof/.cache/hugo/public/. _site/docs/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/docs/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
