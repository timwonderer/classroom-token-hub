name: Deploy status service to Google Cloud

on:
  push:
    branches: [main]
    paths:
      - "status/**"
      - "status_service/**"
      - "tests/test_status_*.py"
      - ".github/workflows/deploy-status.yml"
  pull_request:
    paths:
      - "status/**"
      - "status_service/**"
      - "tests/test_status_*.py"
      - ".github/workflows/deploy-status.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: cth-production-status
  GCP_REGION: us-west2
  ARTIFACT_REPOSITORY: status
  IMAGE_NAME: cth-status

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classroom_economy_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classroom_economy_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install status dependencies
        run: python -m pip install -r requirements.txt -r status_service/requirements.txt pytest
      - name: Compile status service
        run: python -m compileall -q status status_service
      - name: Run focused status tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classroom_economy_v2_test
        run: pytest -q tests/test_status_measurements.py tests/test_status_platform.py tests/test_status_store.py tests/test_status_page.py tests/test_status_sampler.py tests/test_status_identity.py tests/test_status_collector.py tests/test_status_resolution.py tests/test_status_deploy_workflow.py tests/dom/operation/test_health.py

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Authenticate Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push status image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build -f status_service/Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      # Both deploys use the --update-* forms. --set-env-vars and --set-secrets
      # remove every env var and secret they do not list, and the operator's
      # auth configuration (IAP_AUDIENCE, STATUS_OPERATOR_ALLOWLIST,
      # IAP_TRUSTED_EMAIL_HEADER) is held on the service, not in this file. A
      # --set-* deploy empties the allowlist, and then both operator auth paths
      # refuse everyone. tests/test_status_deploy_workflow.py holds this.
      - name: Deploy public status service
        run: >-
          gcloud run deploy cth-status-public
          --image "$IMAGE_URI"
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --update-env-vars "STATUS_SERVICE_MODE=public,FIRESTORE_DATABASE=cth-status-prod"
          --quiet
      - name: Deploy operator status service
        id: deploy_operator
        run: >-
          gcloud run deploy cth-status-operator
          --image "$IMAGE_URI"
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --update-env-vars "STATUS_SERVICE_MODE=operator,FIRESTORE_DATABASE=cth-status-prod"
          --update-secrets "STATUS_SESSION_SECRET=status-session-secret:latest"
          --quiet
      # Explicitly opt in after provisioning the collector identity, secret
      # access, Firestore permissions, and Scheduler trigger in the ops runbook.
      # The presence of Secret Manager versions alone must not activate probing.
      - name: Deploy app health collector job
        if: ${{ vars.STATUS_APP_HEALTH_COLLECTOR_ENABLED == 'true' }}
        run: >-
          gcloud run jobs deploy cth-status-app-health-collector
          --image "$IMAGE_URI"
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --service-account "status-probe@cth-production-status.iam.gserviceaccount.com"
          --command python
          --args=-m,status_service.collector
          --update-env-vars "FIRESTORE_DATABASE=cth-status-prod"
          --update-secrets "CF_ACCESS_CLIENT_ID=cth-status-cf-access-client-id:latest,CF_ACCESS_CLIENT_SECRET=cth-status-cf-access-client-secret:latest"
          --quiet
      # Inspects the services rather than requesting them. Both run with
      # restricted ingress, so their run.app URLs answer a GitHub runner with
      # Google's 404 (run 34928799354) and an HTTP probe from here cannot pass.
      # Each service must report Ready, have no newer revision that failed to
      # become ready, route all traffic to its ready revision, and run this
      # commit's image.
      - name: Verify both services are serving this commit
        run: |
          for service in cth-status-public cth-status-operator; do
            gcloud run services describe "$service" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/$service.json"
          done
          python3 - "$RUNNER_TEMP/cth-status-public.json" "$RUNNER_TEMP/cth-status-operator.json" <<'PY'
          import json
          import os
          import sys

          failed = False
          for path in sys.argv[1:]:
              with open(path) as handle:
                  service = json.load(handle)
              name = service["metadata"]["name"]
              status = service.get("status", {})
              revision = status.get("latestReadyRevisionName")
              conditions = {condition.get("type"): condition.get("status") for condition in status.get("conditions", [])}
              images = {container.get("image") for container in service["spec"]["template"]["spec"]["containers"]}
              traffic = sum(target.get("percent", 0) for target in status.get("traffic", []) if target.get("revisionName") == revision)
              checks = (
                  (conditions.get("Ready") == "True", "is not Ready"),
                  (bool(revision) and revision == status.get("latestCreatedRevisionName"), "has a newer revision that did not become ready"),
                  (bool(revision) and traffic == 100, "does not route all traffic to its ready revision"),
                  (images == {os.environ["IMAGE_URI"]}, "is not running this commit's image"),
              )
              problems = [problem for passed, problem in checks if not passed]
              print(f"{name}: {revision or '<no ready revision>'}", "NOT serving" if problems else "serving")
              for problem in problems:
                  print(f"::error::{name} {problem}.")
              failed = failed or bool(problems)
          sys.exit(1 if failed else 0)
          PY
      # Runs whenever the operator deploy succeeded, even when the check above
      # failed. Steps after a failure are skipped by default, which is how run
      # 34928799354 went live without this check ever running. Prints names and
      # states only, never values: this repository's Actions logs are public,
      # and the allowlist is operator email addresses. A Secret Manager
      # reference names a secret without proving it holds anything, so its
      # payload is read to check it is not blank; a secret this job cannot read
      # fails as unverified rather than passing.
      - name: Verify operator auth configuration survived the deploy
        if: ${{ !cancelled() && steps.deploy_operator.outcome == 'success' }}
        run: |
          gcloud run services describe cth-status-operator --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/operator-service.json"
          python3 - "$RUNNER_TEMP/operator-service.json" <<'PY'
          import json
          import os
          import subprocess
          import sys

          CONSEQUENCE = {
              "STATUS_OPERATOR_ALLOWLIST": "every operator request is refused",
              "IAP_AUDIENCE": "the signed IAP assertion is never verified",
          }

          with open(sys.argv[1]) as handle:
              containers = json.load(handle)["spec"]["template"]["spec"]["containers"]
          env = {entry["name"]: entry for container in containers for entry in container.get("env", [])}


          def secret_payload(ref):
              if not ref.get("name"):
                  return None
              result = subprocess.run(
                  ["gcloud", "secrets", "versions", "access", str(ref.get("key", "latest")),
                   "--secret", ref["name"], "--project", os.environ["GCP_PROJECT_ID"]],
                  capture_output=True, text=True, check=False,
              )
              return result.stdout if result.returncode == 0 else None


          def state(name):
              entry = env.get(name, {})
              if "valueFrom" in entry:
                  payload = secret_payload(entry["valueFrom"].get("secretKeyRef", {}))
                  if payload is None:
                      return "UNREADABLE"
                  return "configured" if payload.strip() else "MISSING"
              return "configured" if str(entry.get("value", "")).strip() else "MISSING"


          header = str(env.get("IAP_TRUSTED_EMAIL_HEADER", {}).get("value", "")).strip().lower()
          print("IAP_TRUSTED_EMAIL_HEADER fallback:", "on" if header == "true" else "off")
          states = {name: state(name) for name in CONSEQUENCE}
          for name, current in states.items():
              print(f"{name}: {current}")
              if current == "MISSING":
                  print(f"::error::cth-status-operator has no {name}: {CONSEQUENCE[name]}.")
              elif current == "UNREADABLE":
                  print(f"::error::cth-status-operator reads {name} from Secret Manager, and this job could not read it to confirm it is not blank. The deploy service account needs secretmanager.versions.access on that secret.")
          sys.exit(0 if all(current == "configured" for current in states.values()) else 1)
          PY
