name: Deploy status service to Google Cloud

on:
  push:
    branches: [main]
    paths:
      - "status/**"
      - "status_service/**"
      - "tests/test_status_*.py"
      - ".github/workflows/deploy-status.yml"
  pull_request:
    paths:
      - "status/**"
      - "status_service/**"
      - "tests/test_status_*.py"
      - ".github/workflows/deploy-status.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: cth-production-status
  GCP_REGION: us-west2
  ARTIFACT_REPOSITORY: status
  IMAGE_NAME: cth-status

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: classroom_economy_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classroom_economy_v2_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install status dependencies
        run: python -m pip install -r requirements.txt -r status_service/requirements.txt pytest
      - name: Compile status service
        run: python -m compileall -q status status_service
      - name: Run focused status tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/classroom_economy_v2_test
        run: pytest -q tests/test_status_contracts.py tests/test_status_projection.py tests/test_status_telemetry.py tests/test_status_identity.py tests/test_status_deploy_workflow.py

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Authenticate Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and push status image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" status_service
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
      # Both deploys use the --update-* forms. --set-env-vars and --set-secrets
      # remove every env var and secret they do not list, and the operator's
      # auth configuration (IAP_AUDIENCE, STATUS_OPERATOR_ALLOWLIST,
      # IAP_TRUSTED_EMAIL_HEADER) is held on the service, not in this file. A
      # --set-* deploy empties the allowlist, and then both operator auth paths
      # refuse everyone. tests/test_status_deploy_workflow.py holds this.
      - name: Deploy public status service
        run: >-
          gcloud run deploy cth-status-public
          --image "$IMAGE_URI"
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --update-env-vars "STATUS_SERVICE_MODE=public,FIRESTORE_DATABASE=cth-status-prod"
          --quiet
      - name: Deploy operator status service
        run: >-
          gcloud run deploy cth-status-operator
          --image "$IMAGE_URI"
          --region "$GCP_REGION"
          --project "$GCP_PROJECT_ID"
          --update-env-vars "STATUS_SERVICE_MODE=operator,FIRESTORE_DATABASE=cth-status-prod"
          --update-secrets "STATUS_SESSION_SECRET=status-session-secret:latest"
          --quiet
      # `/health/status` is the application's endpoint, not this service's. The
      # status service exposes `/health`, so asking it for the other path would
      # 404 and fail the deploy after both revisions had already gone live.
      - name: Verify public status service is answering
        run: |
          URL="$(gcloud run services describe cth-status-public --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')/health"
          curl --fail --silent --show-error "$URL"
      # Last, so the public check above still reports when this one fails.
      # Prints names and states only, never values: this repository's Actions
      # logs are public, and the allowlist is operator email addresses.
      - name: Verify operator auth configuration survived the deploy
        run: |
          gcloud run services describe cth-status-operator --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/operator-service.json"
          python3 - "$RUNNER_TEMP/operator-service.json" <<'PY'
          import json
          import sys

          CONSEQUENCE = {
              "STATUS_OPERATOR_ALLOWLIST": "every operator request is refused",
              "IAP_AUDIENCE": "the signed IAP assertion is never verified",
          }

          with open(sys.argv[1]) as handle:
              containers = json.load(handle)["spec"]["template"]["spec"]["containers"]
          env = {entry["name"]: entry for container in containers for entry in container.get("env", [])}


          def configured(name):
              entry = env.get(name, {})
              return bool(str(entry.get("value", "")).strip()) or "valueFrom" in entry


          header = str(env.get("IAP_TRUSTED_EMAIL_HEADER", {}).get("value", "")).strip().lower()
          print("IAP_TRUSTED_EMAIL_HEADER fallback:", "on" if header == "true" else "off")
          missing = [name for name in CONSEQUENCE if not configured(name)]
          for name in CONSEQUENCE:
              print(f"{name}:", "MISSING" if name in missing else "configured")
          for name in missing:
              print(f"::error::cth-status-operator has no {name}: {CONSEQUENCE[name]}.")
          sys.exit(1 if missing else 0)
          PY
