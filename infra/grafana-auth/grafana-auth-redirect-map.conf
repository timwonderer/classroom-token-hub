# Install as /etc/nginx/conf.d/grafana_auth_redirect_map.conf (http{} level:
# nginx allows "map" only there). Read by "location @grafana_login_redirect"
# in the app server block; see nginx-grafana.conf beside this file.
#
# When the Grafana auth_request check fails, only a top-level page load is
# sent to the sysadmin login page. Everything else -- Grafana's fetch/XHR
# polling (api/ds/query, api/annotations, api/login/ping), its live websocket,
# scripts and styles -- gets a bare 401.
#
# Redirecting background requests was the bug: fetch() follows a 302, so each
# poll from a Grafana tab that had outlived its sysadmin session downloaded
# the full /sysadmin/login page (and later a 429) instead of seeing a 401.
# Grafana never learned it was signed out and kept polling every 5 seconds.
# Given a 401, Grafana pings api/login/ping, gets 401 again and reloads the
# window (backend_srv.ts loginPing -> contextSrv.setLoggedOut ->
# window.location.reload()). The reload is a navigation, so it is redirected
# here exactly once and the tab stops polling.
#
# Classification, same rule as _is_background_request() in app/auth.py:
#   Sec-Fetch-Mode: navigate                   -> 1 (redirect to login)
#   Sec-Fetch-Mode: anything else              -> 0 (401)
#     (cors, no-cors, same-origin, websocket)
#   no Sec-Fetch-Mode and Accept has text/html -> 1 (browser without
#                                                    Fetch Metadata)
#   no Sec-Fetch-Mode otherwise                -> 0 (401)
map "$http_sec_fetch_mode:$http_accept" $grafana_auth_redirect_to_login {
    default         0;
    "~*^navigate:"  1;
    "~*^:.*text/html" 1;
}
