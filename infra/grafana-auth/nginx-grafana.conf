# The Grafana locations inside the existing app HTTPS server
# (/etc/nginx/sites-available/classroom). Requires the map in
# grafana-auth-redirect-map.conf. Keep the server's Cloudflare/origin policy.
#
# nginx asks Flask for permission on every request via auth_request ->
# /sysadmin/grafana/auth-check (sysadmin.grafana_auth_check), which requires a
# sysadmin BoundaryContext and enforces the sysadmin session timeout before
# returning X-Auth-User. Grafana's [auth.proxy] trusts X-WEBAUTH-USER.

# The authorization oracle. This MUST be an exact-match location: a prefix
# location would be shadowed by "location /sysadmin/grafana/", which would
# send the auth subrequest to Grafana instead of to Flask and defeat the check
# entirely. "internal" keeps it reachable by subrequest only.
location = /sysadmin/grafana/auth-check {
    internal;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-CF-Edge-IP $realip_remote_addr;

    # An auth subrequest carries headers (the session cookie is what Flask
    # reads) but never a body.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# Grafana's mount point without its trailing slash.
location = /sysadmin/grafana {
    return 302 /sysadmin/grafana/;
}

location /sysadmin/grafana/ {
    auth_request /sysadmin/grafana/auth-check;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    error_page 401 = @grafana_login_redirect;

    # No trailing slash and no URI part: the full original path is passed
    # through, which is what Grafana's serve_from_sub_path expects.
    proxy_pass http://127.0.0.1:3000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-WEBAUTH-USER $auth_user;
    proxy_set_header X-WEBAUTH-ROLE Admin;

    # Grafana's live panels and Explore use websockets.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# An unauthenticated or expired sysadmin who loads a Grafana page gets the
# login page, and returns to what they asked for afterwards. Background
# requests get a bare 401 instead: see grafana-auth-redirect-map.conf.
location @grafana_login_redirect {
    if ($grafana_auth_redirect_to_login) {
        return 302 /sysadmin/login?next=$request_uri;
    }
    default_type application/json;
    return 401 '{"message":"System admin session required"}\n';
}
