port 0
unixsocket /run/cth-rate-limit/redis.sock
unixsocketperm 660
protected-mode yes
daemonize no
dir /run/cth-rate-limit
save ""
appendonly no
slowlog-log-slower-than -1
maxmemory 64mb
maxmemory-policy noeviction
user default on nopass ~* +@read +@write +@scripting +ping +hello +client|setname -flushall -flushdb
