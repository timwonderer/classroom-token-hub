# CTH restricted origin @INSTALL_ID@
user www-data;
worker_processes 1;
pid /run/cth-ingress/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    # The enrolled loopback connector authenticates the edge and overwrites this header.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    access_log off;
    client_body_temp_path /run/cth-ingress/body;
    proxy_temp_path /run/cth-ingress/proxy;
    fastcgi_temp_path /run/cth-ingress/fastcgi;
    uwsgi_temp_path /run/cth-ingress/uwsgi;
    scgi_temp_path /run/cth-ingress/scgi;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name @HOST@;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host != "@HOST@") { return 444; }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host @HOST@;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $remote_addr;
            proxy_set_header X-CF-Edge-IP "";
        }
    }
}
