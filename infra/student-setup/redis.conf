# Dedicated volatile username staging. Never share the rate-limit Redis DB.
port 0
unixsocket /run/cth-student-setup/redis.sock
unixsocketperm 660
protected-mode yes
daemonize no
supervised no
dir /run/cth-student-setup
save ""
appendonly no
slowlog-log-slower-than -1
latency-monitor-threshold 0
maxmemory 32mb
maxmemory-policy noeviction
# Only app commands; no snapshot, replication, configuration mutation or MONITOR.
user default on nopass ~cth:student-setup:* +ping +hello +get +set +del +sadd +smembers +expire +watch +unwatch +multi +exec +discard +config|get +info +client|setname
