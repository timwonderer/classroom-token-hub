version: 1
families:
  - family_id: CI-ARC-EXEC
    governing_authority: [INV-ARC-000, INV-ARC-003, INV-ARC-006, INV-ARC-007, INV-ARC-009, INV-ARC-021]
    path_rules: [app/feats/**, app/routes/**, app/services/**, tests/dom/operation/**, docs/FEATURE-EXECUTION/**]
    evidence_kind: [static, runtime]
    evidence_commands:
      - tests/dom/operation/test_feat_enforcement.py
      - tests/dom/operation/test_feat_context_transactions.py
    auxiliary_evidence: [policy_guardrails]
    mandatory: true
    pass_contract: FEAT and transaction-boundary evidence executes successfully.
    known_limits: Static checks and selected runtime tests do not prove all cross-domain paths.
  - family_id: CI-SCOPE
    governing_authority: [INV-ARC-001, INV-ARC-002, INV-ARC-004, INV-ARC-008, INV-ARC-010, INV-ARC-011, INV-ARC-013, INV-ARC-014, INV-ARC-019]
    path_rules: [app/routes/**, app/services/context*, app/models.py, tests/dom/class/**, tests/dom/identity/**, docs/DOMAIN/DOM-CLASS-001*]
    evidence_kind: [runtime]
    evidence_commands:
      - tests/dom/class/test_feature_scope_single_active_class.py
      - tests/dom/class/test_pending_student_class_isolation.py
      - tests/dom/class/test_hard_delete_class_scope_isolation.py
      - tests/dom/identity/test_class_context_and_switching.py
      - tests/dom/identity/test_admin_tenancy.py
    mandatory: true
    pass_contract: Selected class and seat scope evidence executes successfully.
    known_limits: Static analysis supplements but cannot replace behavioral isolation evidence.
  - family_id: CI-TEMPORAL
    governing_authority: [INV-ARC-015]
    path_rules: [app/utils/canonical_temporal_resolver.py, app/utils/temporal_*, tests/dom/temporal/**, docs/INVARIANT/ARCHITECTURE/INV-ARC-015*]
    evidence_kind: [static, runtime]
    evidence_commands:
      - tests/dom/temporal/test_SPEC_TIME_001__canonical_temporal_resolver.py
    mandatory: true
    pass_contract: Canonical resolver evidence executes successfully.
    known_limits: Timezone immutability, prohibited API scans, and historical non-reinterpretation remain uncovered.
  - family_id: CI-PERSIST
    governing_authority: [INV-ARC-012, INV-ARC-016]
    path_rules: [migrations/**, app/models.py, app/routes/admin.py, tests/test_class_phase2_persistence.py, tests/dom/class/test_hard_delete_class_scope_isolation.py]
    evidence_kind: [static, runtime, persistence]
    evidence_commands:
      - tests/test_class_phase2_persistence.py
      - tests/dom/class/test_hard_delete_class_scope_isolation.py
    auxiliary_evidence: [migration_validator]
    mandatory: true
    pass_contract: Selected persistence and authorized lifecycle evidence executes successfully.
    known_limits: AuditEvent lineage and PII-specific deletion evidence are not complete.
  - family_id: CI-PII
    governing_authority: [INV-ARC-005, INV-ARC-018, INV-ARC-019]
    path_rules: [app/models.py, app/services/identity/**, migrations/**, tests/dom/identity/**, docs/INVARIANT/ARCHITECTURE/INV-ARC-018*]
    evidence_kind: [static, runtime, persistence]
    evidence_commands:
      - tests/dom/identity/test_pii_retention_deletion.py
      - tests/dom/identity/test_orphaned_user_deletion.py
    auxiliary_evidence: [pii_storage_validator]
    mandatory: true
    pass_contract: >-
      INV-ARC-018 storage form and retention are both evidenced. The storage allowlist
      (§V-§VII) is checked statically against app/models.py, and the four §VIII deletion
      rules are exercised against a real database: seat deletion destroys the identity
      profile and claim hashes in the same transaction, the schema cascade destroys
      profile PII independently of the deletion helper, user deletion destroys the
      username hash, and class teardown leaves no profile referencing a deleted seat.
    known_limits: >-
      INV-ARC-005 is named in this family's governing authority but is not evidenced at
      all. Nothing here gates PII in logs, telemetry, error messages, or URLs, and in
      particular DisplayMetadata serializes decrypted first and last names into the
      Flask session with no test on that boundary. That is nine name fields in a signed
      but unencrypted cookie, and it needs reconciling against INV-ARC-005 §V on its own
      terms: that rule bars sensitive personal information from request context beyond
      allowed invariant-defined fields, and a cached DisplayMetadata is request context.
      SPEC-SEC-001 §V.2.3 is adjacent but weaker, reading on storage form rather than
      session transport; §V.5 does not reach this at all, since it governs what a
      security event record may contain. It is not a teacher_note question: the note is author-supplied free
      text the platform never interprets, it is a required DisplayMetadata field under
      SPEC-DISPLAY-001 §VI with its own §VII invalidation rule, and its contract is
      class and teacher scope rather than content classification. An earlier revision
      of this text bundled the two, which sent a fix at the one field that was not the
      concern. Note scope is now evidenced by tests/test_identity_teacher_note_surface.py.
      The storage
      check is an AST scan of app/models.py by column name: it reads neither the live
      database schema nor migrations/**, and it cannot prove a column named *_hash is
      HMAC-produced at runtime rather than merely named so. Free-text columns are
      governed only by storage form, since their contents are author-supplied and the
      application does not interpret them. §VII.4 backup retention is outside CI
      entirely. Of INV-ARC-019 this family covers only the PII-bearing subset of the
      identity model; its scope and ownership rules are evidenced under CI-SCOPE.
  - family_id: CI-XDOMAIN
    governing_authority: [INV-ARC-021]
    path_rules: [app/feats/**, app/services/**, app/models.py, migrations/**]
    evidence_kind: [static, persistence]
    evidence_commands: []
    auxiliary_evidence: [cross_domain_validator]
    mandatory: true
    pass_contract: >-
      No service or FEAT imports a route, no domain service imports a coordination
      FEAT outside the app.feats.base execution harness (§V.2, §V.6), and no foreign
      key crosses a DOM-CORE-002 §V domain boundary except through the class_id,
      seat_id, or user_id anchors (§V.7) — beyond an enumerated baseline of
      pre-existing violations, which must shrink by deletion rather than decay.
    known_limits: >-
      Static declaration only. Coordination performed through dynamic import or
      service-locator lookup is not observable, and §V.1, §V.3, §V.5, and §V.8 are
      not covered. Route-layer composition is evidenced by CI-ARC-EXEC, which also
      governs INV-ARC-021. Tables absent from DOM-CORE-002 §V are reported as
      unattributed rather than judged.
  - family_id: CI-RENDER
    governing_authority: [INV-ARC-020]
    path_rules: [templates/**, static/css/**, static/js/**, app/services/*view*.py, app/routes/**, tests/test_accessibility.py]
    evidence_kind: [static, browser]
    evidence_commands:
      - tests/test_accessibility.py
    mandatory: true
    pass_contract: Narrow static HTML checks execute successfully; browser completeness is not claimed.
    known_limits: >-
      The audit is parametrized over ACCESSIBILITY_TEMPLATE_PATHS, so it covers only templates
      changed by the pull request. A change that selects this family without touching a template
      audits nothing and still reports PASS. Templates that extend a layout are skipped as
      fragments, as are layouts, macros, components, and named partials, so a pull request whose
      templates are all of those kinds also reports PASS having audited nothing. That is most of
      the tree: 52 of 86 top-level templates currently extend a layout. Rendered browser, computed
      styles, keyboard behavior, and real Axe evidence remain uncovered.
  - family_id: CI-VALIDATION
    governing_authority: [INV-ARC-017]
    path_rules: [.ci/**, .github/workflows/**, scripts/**, tests/conftest.py, docs/SPEC/SPEC-INV-001*]
    evidence_kind: [static, runtime]
    evidence_commands:
      - tests/test_ci_classifier.py
      - tests/test_ci_evidence_runner.py
      - tests/test_migration_validator.py
      - tests/test_pii_storage_validator.py
      - tests/test_cross_domain_validator.py
    mandatory: true
    pass_contract: >-
      Classifier selection, manifest self-check, and the migration idempotency,
      PII storage, and cross-domain gates execute successfully.
    known_limits: This family does not establish application invariant behavior.
