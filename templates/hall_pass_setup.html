<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Hall Pass Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link href="{{ static_url('css/tokens.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <main id="main-content" aria-labelledby="hall-pass-configuration-heading">
        <div class="setup-container">
            <div class="setup-page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <div class="eyebrow">Classroom Token Hub</div>
                    <h1 id="hall-pass-configuration-heading" class="mb-2">
                        <span class="material-symbols-outlined align-middle" aria-hidden="true">settings</span>
                        Hall Pass Configuration
                    </h1>
                    <p class="text-muted">Configure pass types, limits, and availability for your classroom.</p>
                </div>
                <a href="{{ url_for('admin.hall_pass') }}" class="btn btn-outline-secondary">
                    <span class="material-symbols-outlined align-middle">arrow_back</span>
                    Back to Hall Passes
                </a>
            </div>
        </div>
        {% include "components/hall_pass_configuration.html" with context %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
