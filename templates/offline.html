<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Classroom Token Hub</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">

    <link href="{{ url_for('static', filename='css/tokens.css') }}" rel="stylesheet">
    <style>
        .offline-page {
            font-family: var(--font-family);
            background-color: var(--neutral-100);
            color: var(--neutral-800);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: var(--space-5);
        }

        .offline-container {
            max-width: 400px;
        }

        .offline-container .icon {
            font-size: var(--icon-3xl);
            color: var(--primary);
            margin-bottom: var(--space-5);
        }

        :where(.offline-page) h1 {
            font-weight: var(--weight-bold);
            margin-bottom: var(--space-2);
            color: var(--text-primary);
        }

        :where(.offline-page) p {
            margin-bottom: var(--space-5);
            color: var(--text-muted);
        }

        :where(.offline-page) .btn-primary {
            background-color: var(--primary) !important;
            border: none !important;
        }

        /* This page deliberately doesn't load style.css (offline-safe: only
           what's inlined/cached here is guaranteed available), so the real
           .skip-link rule never applies and the link fell back to the
           browser's default blue-on-white -- 4.12:1, short of WCAG AA's
           4.5:1. A same-named selector here would collide with style.css's
           own .skip-link rule (SPEC-DES-001 R7), so this is its own name,
           mirroring that rule's intent (--primary bg, inverse text) rather
           than its exact selector. */
        .offline-skip-link {
            position: fixed;
            top: -100px;
            left: 0;
            background: var(--primary);
            color: var(--text-inverse);
            padding: var(--space-2) var(--space-4);
            z-index: 9999;
            text-decoration: none;
        }

        .offline-skip-link:focus {
            top: 0;
        }
    </style>
</head>

<body class="offline-page">
    <a href="#offline-main" class="offline-skip-link">Skip to main content</a>
    <main id="offline-main">
    <div class="offline-container">
        <div class="icon">
            <span class="material-symbols-outlined" aria-hidden="true">wifi_off</span>
            <!-- Use a cellular-specific offline icon alongside wifi_off to indicate loss of network connectivity -->
            <span class="material-symbols-outlined" aria-hidden="true">signal_cellular_connected_no_internet_0_bar</span>
        </div>
        <h1>You are offline</h1>
        <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
        <a href="/" class="btn btn-primary">Try Again</a>
    </div>
    </main>
    <script>document.querySelectorAll('.material-symbols-outlined').forEach((icon) => icon.setAttribute('aria-hidden', 'true'));</script>
</body>

</html>
