<!-- templates/student_setup_complete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Complete | Classroom Token Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">

    <link href="{{ static_url('css/tokens.css') }}" rel="stylesheet">
    <link href="{{ static_url('css/style.css') }}" rel="stylesheet">
    <style>
        .setup-complete-page {
            background: linear-gradient(135deg, var(--info) 0%, var(--info) 50%, var(--info) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: var(--space-6);
        }
        :where(.setup-complete-page) .card {
            padding: var(--space-8);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            background-color: var(--surface);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }
        :where(.setup-complete-page) h1 {
            font-size: var(--text-3xl);
            margin-bottom: var(--space-4);
            color: var(--primary);
            font-weight: var(--weight-bold);
        }
        :where(.setup-complete-page) p {
            color: var(--text-secondary);
            margin: 0;
        }
        .setup-complete-icon {
            color: var(--success);
        }
        :where(.setup-complete-page) .btn-primary {
            margin-top: var(--space-6);
            background: linear-gradient(135deg, var(--info) 0%, var(--info) 100%);
            border: none;
            font-weight: var(--weight-semibold);
            padding: var(--space-3) var(--space-5);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
        }
        :where(.setup-complete-page) .btn-primary:hover {
            background: linear-gradient(135deg, var(--info) 0%, var(--primary-hover) 100%);
        }
        @media (max-width: 576px) {
            .setup-complete-page {
                padding: var(--space-4);
            }

            :where(.setup-complete-page) .card {
                padding: var(--space-6);
            }

            :where(.setup-complete-page) .material-symbols-outlined {
                font-variation-settings:
                    'FILL' 0,
                    'wght' 400,
                    'GRAD' 0,
                    'opsz' 48
            }
        }
    </style>
</head>
<body class="student-theme setup-complete-page">
    <main id="main-content" aria-labelledby="setup-complete-heading">
    <div class="card">
         <span class="material-symbols-outlined icon-3xl setup-complete-icon" aria-hidden="true">check_circle</span><br>
        <h1 id="setup-complete-heading">Hello, {{ student_name }}!</h1>
        <p class="type-xl">Welcome to <strong>Classroom Token Hub</strong></p>
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-primary">Thanks, Let's Go!</a>
    </div>
    {% set contextual_help_path = 'user-guides/features/student/account/login-setup' %}
{% include 'components/contextual_help_link.html' %}
</main>
</body>
</html>
